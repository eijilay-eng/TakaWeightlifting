<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0e0e11"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#grad)" stroke-width="16" opacity="0.15"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad)" stroke-dasharray="15,10" stroke-width="4" opacity="0.3"/>
  
  <!-- Stylized Weight Barbell/AG Text -->
  <g transform="translate(0, -20)">
    <path d="M120,290 L392,290" stroke="url(#grad)" stroke-width="24" stroke-linecap="round"/>
    <rect x="90" y="250" width="30" height="80" rx="10" fill="url(#grad)"/>
    <rect x="60" y="230" width="20" height="120" rx="10" fill="url(#grad)"/>
    <rect x="392" y="250" width="30" height="80" rx="10" fill="url(#grad)"/>
    <rect x="432" y="230" width="20" height="120" rx="10" fill="url(#grad)"/>
  </g>
  
  <text x="256" y="420" font-family="'Outfit', 'Inter', sans-serif" font-size="95" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">TAKA WL</text>
</svg>
